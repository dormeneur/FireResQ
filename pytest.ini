[pytest]
# Two tiers, cheapest first (docs/Implementation_Plan.md section 14):
#   tests/unit  pure Python, no ROS, no simulator - seconds
#   tests/sim   launch the real simulation and check the robot/sensors/arena against Gazebo
#               ground truth - minutes. Needs: source /opt/ros/jazzy/setup.bash && source install/setup.bash
testpaths = tests
markers =
    sim: launches the real simulation (everything under tests/sim)
    slow: launches extra simulation instances (RGB-only mode, repeatability); deselect with -m "not slow"
addopts = -ra
