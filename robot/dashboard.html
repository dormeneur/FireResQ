<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireResQ Dashboard</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --text: #d7dde5; --muted: #8b95a3;
    --fire: #ff4d3d; --victim: #ffd23f; --done: #3ddc84; --robot: #4da3ff; --path: #e6e6e6; --obst: #9aa4b1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header h1 b { color: var(--fire); }
  #state { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 13px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  #conn.ok::before { content: "● "; color: var(--done); }
  #conn.bad::before { content: "● "; color: var(--fire); }
  main { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; padding: 10px;
         height: calc(100% - 42px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex;
            flex-direction: column; min-height: 0; min-width: 0; }
  section h2 { margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
               text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .body { flex: 1; min-height: 0; position: relative; }
  #cam { width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 0 0 8px 8px; }
  #map { width: 100%; height: 100%; display: block; }
  .legend { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); display: flex;
            gap: 12px; flex-wrap: wrap; pointer-events: none; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px;
              vertical-align: -1px; }
  .feed { overflow-y: auto; padding: 6px 12px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .feed div { padding: 3px 0; border-bottom: 1px solid #1d232c; }
  .feed time { color: var(--muted); margin-right: 8px; }
  .feed .warn { color: #ffb347; }
  .feed .good { color: var(--done); }
  #thoughts { font-family: system-ui, sans-serif; font-size: 14px; }
  #thoughts div { padding: 6px 0; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: repeat(4, 60vh); height: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Fire<b>ResQ</b></h1>
  <span id="state">connecting…</span>
  <span id="conn">robot</span>
</header>
<main>
  <section>
    <h2>Live camera</h2>
    <div class="body"><img id="cam" src="/stream" alt="live camera feed"></div>
  </section>
  <section>
    <h2>Map &amp; localisation</h2>
    <div class="body">
      <canvas id="map"></canvas>
      <div class="legend">
        <span><i style="background:var(--fire)"></i>fire (+ safety ring)</span>
        <span><i style="background:var(--victim)"></i>victim (#rescue order)</span>
        <span><i style="background:var(--done)"></i>reached</span>
        <span><i style="background:var(--obst)"></i>obstacle</span>
        <span><i style="background:var(--robot)"></i>robot + trail</span>
      </div>
    </div>
  </section>
  <section>
    <h2>Actions</h2>
    <div class="body feed" id="log"></div>
  </section>
  <section>
    <h2>Thinking</h2>
    <div class="body feed" id="thoughts"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const canvas = $('map'), ctx = canvas.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let last = null;

function feed(el, items, classify) {
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = '';
  for (const [t, msg] of items) {
    const d = document.createElement('div');
    const tm = document.createElement('time'); tm.textContent = t;
    d.append(tm, document.createTextNode(msg));
    if (classify) d.className = classify(msg);
    el.append(d);
  }
  if (atBottom) el.scrollTop = el.scrollHeight;
}
const logClass = m => /OBSTACLE|FIRE|stalled|Lost|Could not|giving up|REROUTING/i.test(m) ? 'warn'
                    : /RESCUING|COMPLETE|reached/i.test(m) ? 'good' : '';

function draw(s) {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  // map frame: x forward (screen up), y left (screen left)
  const pts = [[0, 0], ...s.trail, ...s.path, ...s.objs.map(o => [o.x, o.y]), ...s.hazards.map(h => [h[0], h[1]]),
               [s.pose[0], s.pose[1]]];
  let minx = Math.min(...pts.map(p => p[0])) - 0.5, maxx = Math.max(...pts.map(p => p[0])) + 0.5;
  let miny = Math.min(...pts.map(p => p[1])) - 0.5, maxy = Math.max(...pts.map(p => p[1])) + 0.5;
  const scale = Math.min(r.width / (maxy - miny), (r.height - 24) / (maxx - minx));
  const cx = r.width / 2 + (maxy + miny) / 2 * scale, cy = (r.height - 24) / 2 + (maxx + minx) / 2 * scale + 4;
  const P = (x, y) => [cx - y * scale, cy - x * scale];

  // half-metre grid
  ctx.strokeStyle = '#1f2630'; ctx.lineWidth = 1;
  for (let x = Math.floor(minx * 2) / 2; x <= maxx; x += 0.5) {
    const [a, b] = P(x, maxy), [c, d] = P(x, miny); ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
  }
  for (let y = Math.floor(miny * 2) / 2; y <= maxy; y += 0.5) {
    const [a, b] = P(maxx, y), [c, d] = P(minx, y); ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
  }
  ctx.fillStyle = css('--muted'); ctx.font = '11px system-ui';
  ctx.fillText('grid 0.5 m', 8, 14);

  // hazards: clearance rings
  for (const [x, y, c, name] of s.hazards) {
    const [px, py] = P(x, y);
    const isFire = name === 'the fire';
    ctx.setLineDash([4, 4]); ctx.strokeStyle = isFire ? css('--fire') : css('--obst'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, c * scale, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    if (!isFire) {
      ctx.fillStyle = css('--obst'); ctx.fillRect(px - 6, py - 6, 12, 12);
    }
  }
  // start point
  const [sx, sy] = P(0, 0);
  ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1.5; ctx.strokeRect(sx - 9, sy - 9, 18, 18);
  ctx.fillStyle = css('--muted'); ctx.fillText('START', sx + 12, sy + 4);
  // planned route
  if (s.path.length > 1) {
    ctx.setLineDash([7, 5]); ctx.strokeStyle = css('--path'); ctx.lineWidth = 1.5; ctx.beginPath();
    s.path.forEach(([x, y], i) => { const [a, b] = P(x, y); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); });
    ctx.stroke(); ctx.setLineDash([]);
  }
  // trail
  ctx.strokeStyle = css('--robot'); ctx.globalAlpha = 0.6; ctx.lineWidth = 2; ctx.beginPath();
  s.trail.forEach(([x, y], i) => { const [a, b] = P(x, y); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); });
  ctx.stroke(); ctx.globalAlpha = 1;
  // objects
  for (const o of s.objs) {
    const [px, py] = P(o.x, o.y);
    if (o.kind === 'fire') {
      if (o.ax !== undefined) {                                   // the box's base edge, as seen on the floor
        const [ax, ay] = P(o.ax, o.ay), [bx, by] = P(o.bx, o.by);
        ctx.strokeStyle = css('--fire'); ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.lineCap = 'butt';
      }
      ctx.fillStyle = css('--fire'); ctx.beginPath(); ctx.arc(px, py, 11, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('🔥', px, py + 4);
      ctx.textAlign = 'left'; ctx.fillStyle = css('--fire'); ctx.font = '12px system-ui'; ctx.fillText('FIRE', px + 14, py + 4);
    } else {
      const target = s.target === o.name;
      ctx.fillStyle = o.reached ? css('--done') : css('--victim');
      ctx.beginPath(); ctx.arc(px, py, 10, 0, 2 * Math.PI); ctx.fill();
      if (target) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py, 15, 0, 2 * Math.PI); ctx.stroke(); }
      ctx.fillStyle = '#111'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(o.name, px, py + 4);
      ctx.textAlign = 'left'; ctx.fillStyle = o.reached ? css('--done') : css('--victim'); ctx.font = '12px system-ui';
      ctx.fillText(`${o.reached ? 'saved ✓' : '#' + o.rank}${target ? '  ← target' : ''}`, px + 16, py + 4);
    }
  }
  // robot
  const [rx, ry] = P(s.pose[0], s.pose[1]), th = s.pose[2];
  ctx.save(); ctx.translate(rx, ry); ctx.rotate(-th - Math.PI / 2);
  ctx.fillStyle = css('--robot'); ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-9, 8); ctx.lineTo(-5, 0); ctx.lineTo(-9, -8);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

async function poll() {
  try {
    const s = await (await fetch('/state', {cache: 'no-store'})).json();
    $('conn').className = 'ok'; $('conn').textContent = 'robot connected';
    $('state').textContent = s.state;
    feed($('log'), s.log, logClass);
    feed($('thoughts'), s.thoughts);
    last = s; draw(s);
  } catch (e) {
    $('conn').className = 'bad'; $('conn').textContent = 'robot offline';
  }
  setTimeout(poll, 500);
}
window.addEventListener('resize', () => last && draw(last));
poll();
</script>
</body>
</html>
